send_notification:
  name: Enviar aviso personalizado
  description: Envia um aviso à TV. Campos omitidos usam os padrões salvos no aplicativo.
    A pausa bloqueia inclusive urgentes.
  target:
    entity:
      domain: notify
      integration: casanotify_tv
  fields:
    message:
      name: Mensagem
      selector:
        text:
          multiline: true
      required: true
    title:
      name: Título
      selector:
        text: {}
    video_decoder:
      name: Decodificação do vídeo
      description: 'TV 2.5.0+: Automática tenta os decodificadores da TV; Software usa um decodificador de software disponível no Android. Não instala codecs e não converte a câmera.'
      selector:
        select:
          options:
          - label: Automática (recomendada)
            value: auto
          - label: Hardware da TV
            value: hardware
          - label: Software disponível na TV
            value: software
    video_transport:
      name: Transporte RTSP
      description: 'TV 2.5.0+: TCP é o padrão e costuma funcionar melhor entre redes. Automático tenta UDP e permite fallback para TCP.'
      selector:
        select:
          options:
          - label: TCP (recomendado)
            value: tcp
          - label: Automático (UDP/TCP)
            value: auto
    video_buffer_ms:
      name: Buffer do vídeo
      description: 'TV 2.5.0+: padrão 800 ms. Aumente se o vídeo engasgar; valores maiores aumentam o atraso.'
      selector:
        number:
          min: 250
          max: 3000
          unit_of_measurement: ms
          mode: box
    id:
      name: Identificador do aviso
      selector:
        text: {}
      description: Reutilize o mesmo ID para substituir um aviso desse evento.
    image_url:
      name: URL da imagem
      selector:
        text: {}
      description: JPEG/PNG/WebP acessível pela TV, sem login. Não é vídeo ao vivo.
    image_refresh:
      name: Atualizar imagem a cada
      selector:
        number:
          min: 0
          max: 60
          step: 1
          mode: box
          unit_of_measurement: s
      description: Use 0 para desativar ou de 5 a 60 segundos.
    theme:
      name: Tema
      selector:
        select:
          options:
          - lime
          - ocean
          - ember
          - rose
          - paper
    position:
      name: Posição
      selector:
        select:
          options:
          - top_left
          - top_center
          - top_right
          - center_left
          - center
          - center_right
          - bottom_left
          - bottom_center
          - bottom_right
    icon:
      name: Ícone
      selector:
        select:
          options:
          - home
          - bell
          - door
          - camera
          - light
          - check
          - warning
          - info
          - sensor
          - motion
          - temperature
          - humidity
          - phone
          - delivery
          - chat
          - battery
          - wifi
          - lock
          - smoke
          - water
          - alarm
    animation:
      name: Animação
      selector:
        select:
          options:
          - slide
          - fade
          - none
    duration:
      name: Duração (segundos)
      selector:
        number:
          min: 3
          max: 120
          step: 1
          mode: box
    width:
      name: Largura (dp)
      selector:
        number:
          min: 260
          max: 800
          step: 1
          mode: box
    text_size:
      name: Tamanho do texto (sp)
      selector:
        number:
          min: 14
          max: 36
          step: 1
          mode: box
    radius:
      name: Cantos (dp)
      selector:
        number:
          min: 0
          max: 40
          step: 1
          mode: box
    margin:
      name: Margem (dp)
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: box
    volume:
      name: Volume (%)
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: box
    opacity:
      name: Opacidade
      selector:
        number:
          min: 0.4
          max: 0.8
          step: 0.01
          mode: box
    background:
      name: Cor de fundo
      selector:
        text: {}
      description: 'Formato #RRGGBB, por exemplo #A3E635.'
    text_color:
      name: Cor do texto
      selector:
        text: {}
      description: 'Formato #RRGGBB, por exemplo #A3E635.'
    accent:
      name: Cor de destaque
      selector:
        text: {}
      description: 'Formato #RRGGBB, por exemplo #A3E635.'
    sound:
      name: Som
      selector:
        boolean: {}
    speak:
      name: Leitura em voz alta
      selector:
        boolean: {}
    urgent:
      name: Urgente (ignora horário silencioso)
      selector:
        boolean: {}
    replace:
      name: Substituir aviso atual
      selector:
        boolean: {}
    progress:
      name: Barra de progresso
      selector:
        boolean: {}
    video_url:
      name: Vídeo RTSP
      description: Endereço RTSP acessível pela TV. Para usar uma entidade de câmera sem copiar credenciais, prefira a ação Mostrar câmera na TV.
      selector:
        text: {}
    video_muted:
      name: Vídeo sem áudio
      selector:
        boolean: {}
    video_decoder:
      name: Decodificação do vídeo
      description: 'TV 2.5.0+: Automática tenta os decodificadores da TV; Software usa um decodificador de software disponível no Android. Não instala codecs e não converte a câmera.'
      selector:
        select:
          options:
          - label: Automática (recomendada)
            value: auto
          - label: Hardware da TV
            value: hardware
          - label: Software disponível na TV
            value: software
    video_transport:
      name: Transporte RTSP
      description: 'TV 2.5.0+: TCP é o padrão e costuma funcionar melhor entre redes. Automático tenta UDP e permite fallback para TCP.'
      selector:
        select:
          options:
          - label: TCP (recomendado)
            value: tcp
          - label: Automático (UDP/TCP)
            value: auto
    video_buffer_ms:
      name: Buffer do vídeo
      description: 'TV 2.5.0+: padrão 800 ms. Aumente se o vídeo engasgar; valores maiores aumentam o atraso.'
      selector:
        number:
          min: 250
          max: 3000
          unit_of_measurement: ms
          mode: box
    camera_id:
      name: ID da câmera salva
      description: Compatibilidade com câmeras salvas em versões antigas. Para novos avisos, use Mostrar câmera na TV com a entidade do Home Assistant.
      selector:
        text: {}
    tone:
      name: Toque do alerta
      selector:
        select:
          options:
          - value: soft
            label: Som 1
          - value: doorbell
            label: Som 2
          - value: chime
            label: Som 3
          - value: pulse
            label: Som 4
          - value: alarm
            label: Som 5
          - value: digital
            label: Som 6
          - value: sound_01
            label: Som 7
          - value: sound_02
            label: Som 8
          - value: sound_03
            label: Som 9
          - value: sound_04
            label: Som 10
          - value: sound_05
            label: Som 11
          - value: sound_06
            label: Som 12
          - value: sound_07
            label: Som 13
          - value: sound_08
            label: Som 14
          - value: sound_09
            label: Som 15
          - value: sound_10
            label: Som 16
    backdrop:
      name: Plano de fundo
      selector:
        select:
          options:
          - none
          - custom
clear_notification:
  name: Limpar aviso
  description: Limpa o aviso com este ID. Sem ID, limpa a tela e toda a fila.
  target:
    entity:
      domain: notify
      integration: casanotify_tv
  fields:
    id:
      name: Identificador (opcional)
      selector:
        text: {}

send_camera_notification:
  name: Mostrar câmera na TV
  description: O Home Assistant resolve a câmera RTSP e envia o aviso à TV. Não depende do aplicativo do celular aberto. A câmera precisa fornecer RTSP acessível pela TV. TV 2.5.0 aceita H.264, H.265/HEVC, H.263, MPEG-4 Visual, VP8 e VP9 conforme os decodificadores do aparelho.
  target:
    entity:
      domain: notify
      integration: casanotify_tv
  fields:
    camera_entity_id:
      name: Câmera do Home Assistant
      required: true
      selector:
        entity:
          domain: camera
    title:
      name: Título
      default: Câmera de segurança
      selector:
        text: {}
    message:
      name: Mensagem
      default: Veja o que está acontecendo.
      selector:
        text: {}
    duration:
      name: Duração
      default: 30
      selector:
        number:
          min: 3
          max: 120
          unit_of_measurement: s
          mode: box
    video_muted:
      name: Vídeo sem áudio
      default: true
      selector:
        boolean: {}
    id:
      name: Identificador do aviso
      selector:
        text: {}
    position:
      name: Posição
      selector:
        select:
          options:
          - top_left
          - top_center
          - top_right
          - center_left
          - center
          - center_right
          - bottom_left
          - bottom_center
          - bottom_right
    sound:
      name: Tocar alerta
      selector:
        boolean: {}
    tone:
      name: Toque do alerta
      selector:
        select:
          options:
          - value: soft
            label: Som 1
          - value: doorbell
            label: Som 2
          - value: chime
            label: Som 3
          - value: pulse
            label: Som 4
          - value: alarm
            label: Som 5
          - value: digital
            label: Som 6
          - value: sound_01
            label: Som 7
          - value: sound_02
            label: Som 8
          - value: sound_03
            label: Som 9
          - value: sound_04
            label: Som 10
          - value: sound_05
            label: Som 11
          - value: sound_06
            label: Som 12
          - value: sound_07
            label: Som 13
          - value: sound_08
            label: Som 14
          - value: sound_09
            label: Som 15
          - value: sound_10
            label: Som 16
    urgent:
      name: Urgente
      selector:
        boolean: {}
    replace:
      name: Substituir aviso atual
      default: true
      selector:
        boolean: {}
